server:
  port: 8000

spring:
  cloud:
    gateway:
      routes:
        - id: iam-service-route
          uri: http://iam-service:8005
          predicates:
            - Path=/api/v1/authentication/**,/api/v1/roles/**,/api/v1/users/**

iam:
  service:
    url: http://iam-service:8005

logging:
  level:
    org.springframework.cloud.gateway: DEBUG